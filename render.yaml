# ============================================================
# EnerSight AI — Render Blueprint
# Repo root-level render.yaml
# ============================================================

services:
  # ── 1. FastAPI Backend ─────────────────────────────────────
  - type: web
    name: energysight-backend
    env: python
    region: oregon
    plan: free
    rootDir: energy-sight-ai/backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python ../scripts/generate_demo_data.py &&
      python ../scripts/train_models.py --skip-lstm --fast
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── 2. Next.js Frontend ────────────────────────────────────
  - type: web
    name: energysight-frontend
    env: node
    region: oregon
    plan: free
    rootDir: energy-sight-ai/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: "https://energysight-backend.onrender.com"
      - key: BACKEND_INTERNAL_URL
        value: "https://energysight-backend.onrender.com"
