# Render Blueprint Specification for EnerSight AI
# Full-Stack Deployment (FastAPI Backend + Next.js Frontend)

services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: energysight-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ../scripts/generate_demo_data.py && python ../scripts/train_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. Next.js Frontend Web Service
  - type: web
    name: energysight-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: energysight-backend
          property: hostport
