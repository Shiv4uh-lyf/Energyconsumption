version: '3.8'

services:
  backend:
    build:
      context: .         # repo root, so scripts/ is accessible
      dockerfile: Dockerfile  # uses root Dockerfile
    container_name: energysight-backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      # Add CORS_ORIGINS if needed:
      # - CORS_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energysight-frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      # NEXT_PUBLIC_API_URL is baked at build time — rebuild after changing
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # BACKEND_INTERNAL_URL is used by Next.js server-side rewrites (internal Docker network)
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
